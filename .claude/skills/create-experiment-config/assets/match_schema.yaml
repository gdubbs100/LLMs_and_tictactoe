# Schema for a match config file (used by evaluation/cli.py to run a two-agent match).
# A match pits exactly two agents (p1 vs p2) against each other for n_games.

# ── Top-level fields ───────────────────────────────────────────────────────────

p1:                         # REQUIRED. Configuration for player 1. See "Agent config" below.
  <<: *agent_config

p2:                         # REQUIRED. Configuration for player 2. See "Agent config" below.
  <<: *agent_config

n_games: 1                  # OPTIONAL (default 1). Number of games to play between p1 and p2.


# ── Agent config (used for p1 and p2) ─────────────────────────────────────────
# Each agent block has three fields: name, type, and kwargs.
# The `type` field selects the agent implementation; `kwargs` are forwarded to its constructor.

# name: REQUIRED. A human-readable label for the agent. Used in result output.
#   Example: "qwen3-0.6b", "alphabeta", "my-random-agent"

# type: REQUIRED. One of the following string values:
#   - "alphabeta"    — deterministic minimax agent; no kwargs needed
#   - "random"       — random-action agent; optional kwargs: seed (int)
#   - "hf"           — HuggingFace local model (HFLLMAgent); see hf_kwargs below
#   - "hf_fallback"  — HFLLMAgent wrapped in FallbackAgent; see fallback_kwargs below
#   - "ollama"       — Ollama-served model (OllamaAgent); see ollama_kwargs below
#   - "ollama_fallback" — OllamaAgent wrapped in FallbackAgent; see fallback_kwargs below

# kwargs: OPTIONAL. A mapping of constructor arguments for the chosen type.
#   Omit entirely for types that need no kwargs (e.g. alphabeta).
#   See per-type kwargs documented below.


# ── kwargs for type: "random" ──────────────────────────────────────────────────
# seed: int | null  — RNG seed for reproducibility. Omit for non-deterministic play.


# ── kwargs for type: "hf" ─────────────────────────────────────────────────────
# model_name:        REQUIRED (str). HuggingFace model ID, e.g. "Qwen/Qwen3-0.6B".
# base_prompt:       REQUIRED (str). System prompt given to the model. Should describe
#                    the game, board indexing (0-8 row-major), and response format.
# enable_thinking:   OPTIONAL (bool, default false). Set true for models that support
#                    chain-of-thought / <think> blocks (e.g. Qwen3).
# pass_valid_actions: OPTIONAL (bool, default true). Whether to include the list of
#                    legal moves in the user message sent to the model.
# stateless:         OPTIONAL (bool, default true). If true, only the system prompt +
#                    current board state are sent each turn (no conversation history).
# max_new_tokens:    OPTIONAL (int, default 256). Maximum tokens the model may generate.
# verbose:           OPTIONAL (bool, default false). Stream output to stdout while generating.
# log_interactions:  OPTIONAL (bool, default true). Record each turn's interaction for review.


# ── kwargs for type: "ollama" ─────────────────────────────────────────────────
# model_name:        REQUIRED (str). Ollama model tag, e.g. "gemma4:31b-cloud".
# base_prompt:       REQUIRED (str). System prompt (same guidance as for "hf").
# enable_thinking:   OPTIONAL (bool, default false). Enable thinking/reasoning mode.
# pass_valid_actions: OPTIONAL (bool, default true). Include legal moves in user message.
# stateless:         OPTIONAL (bool, default true). Send only system prompt + current state.
# log_interactions:  OPTIONAL (bool, default true). Record each turn's interaction.


# ── kwargs for type: "hf_fallback" or "ollama_fallback" ───────────────────────
# max_retries:  OPTIONAL (int, default 1). How many corrective retries to attempt when
#               the primary agent returns an illegal or malformed action.
# primary:      REQUIRED (mapping). Constructor kwargs for the underlying agent — use the
#               same fields as "hf" kwargs (for hf_fallback) or "ollama" kwargs
#               (for ollama_fallback). Do NOT include model_name at the top level;
#               nest it inside `primary`.


# ── Minimal examples ──────────────────────────────────────────────────────────

# Example A — two deterministic agents, no kwargs needed:
# p1:
#   name: alphabeta
#   type: alphabeta
# p2:
#   name: random
#   type: random
# n_games: 10

# Example B — HF model vs alphabeta with fallback:
# p1:
#   name: qwen3-fallback
#   type: hf_fallback
#   kwargs:
#     max_retries: 2
#     primary:
#       model_name: Qwen/Qwen3-0.6B
#       enable_thinking: true
#       pass_valid_actions: true
#       stateless: true
#       max_new_tokens: 512
#       base_prompt: |
#         You are playing Tic-Tac-Toe. ...
# p2:
#   name: alphabeta
#   type: alphabeta
# n_games: 5
