name: tournament-round1
games_per_pair: 10
k_factor: 32.0
initial_rating: 1000.0
seed: 42

agents:
  - name: random
    type: random
    kwargs:
      seed: 1

  - name: alphabeta
    type: alphabeta

  - name: gemma4-ollama
    type: ollama
    kwargs:
      model_name: gemma4:31b-cloud
      enable_thinking: true
      pass_valid_actions: false
      stateless: true
      base_prompt: &basic_prompt |
        You are playing a game
        Actions are integers in [0, 8] indexing cells in row-major order:

         0 | 1 | 2
        -----------
         3 | 4 | 5
        -----------
         6 | 7 | 8

        View the board state and select the best available action to win.
        Respond with a single integer only. No explanation.

  - name: gpt-oss
    type: ollama
    kwargs:
      model_name: gpt-oss:120b-cloud
      enable_thinking: true
      pass_valid_actions: false
      stateless: true
      base_prompt: *basic_prompt

  - name: qwen3-0.6b
    type: hf_fallback
    kwargs:
      max_retries: 2
      primary:
        model_name: Qwen/Qwen3-0.6B
        enable_thinking: true
        pass_valid_actions: false
        stateless: true
        max_new_tokens: 512
        base_prompt: *basic_prompt
