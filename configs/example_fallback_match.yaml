p1:
  name: qwen3-fallback
  type: hf_fallback
  kwargs:
    max_retries: 2
    primary:
      model_name: Qwen/Qwen3-0.6B
      enable_thinking: true
      pass_valid_actions: true
      stateless: true          # only send system prompt + current state (no chat history)
      max_new_tokens: 512
      base_prompt: |
        You are playing Tic-Tac-Toe.
        Actions are integers in [0, 8] indexing cells in row-major order:

         0 | 1 | 2
        -----------
         3 | 4 | 5
        -----------
         6 | 7 | 8

        View the board state and select the best available action to win.
        Think carefully, then respond with a single integer only. No explanation.

p2:
  name: qwen3-fallback-no-thinking
  type: hf_fallback
  kwargs:
    max_retries: 2
    primary:
      model_name: Qwen/Qwen3-0.6B
      enable_thinking: false
      pass_valid_actions: true
      stateless: true          # only send system prompt + current state (no chat history)
      max_new_tokens: 512
      base_prompt: |
        You are playing Tic-Tac-Toe.
        Actions are integers in [0, 8] indexing cells in row-major order:

         0 | 1 | 2
        -----------
         3 | 4 | 5
        -----------
         6 | 7 | 8

        View the board state and select the best available action to win.
        Think carefully, then respond with a single integer only. No explanation.


n_games: 5
