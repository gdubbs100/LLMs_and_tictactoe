# Test tournament for ollama agents.
# Pull models first:  ollama pull llama3.2:1b  &&  ollama pull qwen3:0.6b

name: ollama_test
games_per_pair: 10
k_factor: 32
initial_rating: 1000
seed: 42

agents:
  - name: alphabeta
    type: alphabeta

  - name: random
    type: random
    kwargs:
      seed: 1

  - name: qwen3-fallback
    type: hf_fallback
    kwargs:
      max_retries: 2
      primary:
        model_name: Qwen/Qwen3-0.6B
        enable_thinking: true
        pass_valid_actions: true
        stateless: true
        max_new_tokens: 512
        base_prompt: |
          You are playing Tic-Tac-Toe.
          Actions are integers in [0, 8] indexing cells in row-major order:

           0 | 1 | 2
          -----------
           3 | 4 | 5
          -----------
           6 | 7 | 8

          View the board state and select the best available action to win.
          Think carefully, then respond with a single integer only. No explanation.

  - name: gpt-oss
    type: ollama
    kwargs:
      model_name: gpt-oss:120b-cloud
      enable_thinking: false
      pass_valid_actions: true
      stateless: true
      base_prompt: |
        You are playing Tic-Tac-Toe.
        Actions are integers in [0, 8] indexing cells in row-major order:

         0 | 1 | 2
        -----------
         3 | 4 | 5
        -----------
         6 | 7 | 8

        View the board state and select the best available action to win.
        Respond with a single integer only. No explanation.

  - name: gemma4-ollama-fallback
    type: ollama_fallback
    kwargs:
      max_retries: 2
      primary:
        model_name: gemma4:31b-cloud
        enable_thinking: true
        pass_valid_actions: true
        stateless: true
        base_prompt: |
          You are playing Tic-Tac-Toe.
          Actions are integers in [0, 8] indexing cells in row-major order:

           0 | 1 | 2
          -----------
           3 | 4 | 5
          -----------
           6 | 7 | 8

          View the board state and select the best available action to win.
          Think carefully, then respond with a single integer only. No explanation.
