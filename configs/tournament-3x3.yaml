name: tournament-3x3
games_per_pair: 15
k_factor: 32.0
initial_rating: 1000.0

env:
  size: 3
  win_length: 3

agents:
  - name: random
    type: random

  - name: alphabeta
    type: alphabeta

  - name: gemma4-ollama
    type: ollama
    kwargs:
      model_name: gemma4:31b-cloud
      enable_thinking: true
      pass_valid_actions: false
      stateless: true
      base_prompt: &prompt_3x3 |
        You are playing a game on a 3x3 grid. The cells are numbered 0-8 in
        row-major order, starting at the top-left (0) and going
        left-to-right, top-to-bottom, so the bottom-right cell is 8:

         0 | 1 | 2
        -----------
         3 | 4 | 5
        -----------
         6 | 7 | 8

        Two players take turns placing their mark in an empty cell. The first player to get 3 of their own
        marks in a line — horizontally, vertically, or diagonally — wins. If
        every cell is filled with no such line, the game is a draw.

        Each turn you will see the current state of the board.
        Respond with a single integer (representing the cell number in which you place your token) only. 
        No explanation.

  - name: gpt-oss
    type: ollama
    kwargs:
      model_name: gpt-oss:120b-cloud
      enable_thinking: true
      pass_valid_actions: false
      stateless: true
      base_prompt: *prompt_3x3

  - name: qwen3-fallback
    type: hf_fallback
    kwargs:
      max_retries: 2
      primary:
        model_name: Qwen/Qwen3-0.6B
        enable_thinking: false
        pass_valid_actions: false
        stateless: true          # only send system prompt + current state (no chat history)
        max_new_tokens: 512
        base_prompt: *prompt_3x3

